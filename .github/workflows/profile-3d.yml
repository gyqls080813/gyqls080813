name: GitHub-Profile-3D-Contrib

on:
  schedule: # 매일 자정에 실행 (KST 기준 오전 9시)
    - cron: "0 0 * * *"
  workflow_dispatch: # 수동으로도 실행 가능하게 설정

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v3
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Crop SVG (Remove charts)
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          ET.register_namespace('', 'http://www.w3.org/2000/svg')
          tree = ET.parse('profile-3d-contrib/profile-green-animate.svg')
          root = tree.getroot()
          for g in root.findall('{http://www.w3.org/2000/svg}g'):
              transform = g.get('transform', '')
              if 'translate(980' in transform or 'translate(40, 520)' in transform:
                  root.remove(g)
          tree.write('profile-3d-contrib/profile-green-animate.svg')
          "
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "Generated 3D Profile Contrib"
          git push
